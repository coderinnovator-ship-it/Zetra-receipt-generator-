name: Build Production APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set Up Java Development Kit Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set Up Android SDK Matrix
        uses: android-actions/setup-android@v3

      - name: Install Android Packaging Tools
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          # Dynamically inject the exact paths using system variables
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Generate Web App Configuration Files
        run: |
          echo '{
            "name": "Zetra Receipt Generator",
            "short_name": "ZetraReceipt",
            "start_url": "https://coderinnovator-ship-it.github.io/Zetra-receipt-generator-",
            "display": "standalone",
            "background_color": "#764ba2",
            "theme_color": "#667eea",
            "icons": [
              {
                "src": "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=512",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }' > manifest.json

      - name: Initialize Android Package Environment
        run: |
          bubblewrap init --manifest=manifest.json --metaLabelling=none --noprompt || true

      - name: Compile Standalone Production APK
        run: |
          bubblewrap build --skipSigning

      - name: Upload Clean Compiled Binary Asset to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: zetra-receipt-apk
          path: "./*.apk"
          if-no-files-found: error
          retention-days: 7
