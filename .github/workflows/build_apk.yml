name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository Codebase
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK Environments
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Build-Tools and Platforms
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Cordova CLI Tools Global Module
        run: |
          npm install -g cordova

      - name: Assemble Local App Container
        run: |
          cordova create zetra_app com.zetralab.receipt ZetraReceipt
          cd zetra_app
          cordova platform add android --no-telemetry
          # Native sharing asset layer dependency injection hook
          cordova plugin add cordova-plugin-x-socialsharing --no-telemetry
          rm -rf www/*
          cp ../index.html www/index.html
          sed -i 's/<head>/<head><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">/' www/index.html

      - name: Grant Execute Permissions to Gradle Wrapper
        run: |
          chmod +x zetra_app/platforms/android/gradlew

      - name: Execute Production Build Matrix Pipeline
        run: |
          cd zetra_app
          cordova build android --release --no-telemetry -- --gradleArg=-PcdvMinSdkVersion=24

      - name: Archive Compiled Production Application Package
        uses: actions/upload-artifact@v4
        with:
          name: ZetraReceipt-Release-Package
          path: zetra_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
