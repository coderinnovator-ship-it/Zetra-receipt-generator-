name: Build Production APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set Up Java Development Kit Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set Up Android SDK Matrix
        uses: android-actions/setup-android@v3

      - name: Install Cordova Compiler Engine
        run: npm install -g cordova

      - name: Assemble Local App Container
        run: |
          # Create a fresh Cordova project matrix
          cordova create zetra_app com.zetralab.receipt ZetraReceipt
          cd zetra_app
          
          # Add the Android deployment platform
          cordova platform add android --no-telemetry
          
          # Clear the placeholder web files and copy your professional source code inside
          rm -rf www/*
          cp ../index.html www/index.html
          
          # Force layout optimization for full mobile viewports
          sed -i 's/<head>/<head><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">/' www/index.html

      - name: Compile Standalone Production APK
        run: |
          cd zetra_app
          cordova build android --release --no-telemetry -- --packageType=apk

      - name: Upload Clean Compiled Binary Asset to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: zetra-receipt-apk
          path: "zetra_app/platforms/android/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 7
